<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Productos</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <header>
        <nav>
            <ul class="menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="inventario.html">Inventario</a></li>
                <li><a href="ventas.html">Ventas</a></li>
                <li><a href="reportes.html">Reportes</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contenedor">
            <h2>Listado de Productos</h2>
            <div id="productosContainer" class="grid">
                <!-- Aquí se cargará dinámicamente el contenido de listar_productos.php -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Las Abuelitas - Todos los derechos reservados</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetch("listar_productos.php")
                .then(response => response.text())
                .then(data => {
                    document.getElementById("productosContainer").innerHTML = data;
                })
                .catch(error => console.error("Error cargando los productos:", error));
        });
    </script>
</body>
</html>
